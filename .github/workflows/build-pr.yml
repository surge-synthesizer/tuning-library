name: PR
on:
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  build_plugin:
    name: Test - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
          - os: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Locales on Linux
        if: runner.os == 'Linux'
        run: |
          sudo locale-gen es_ES
          sudo locale-gen fr_FR
          sudo locale-gen ja_JP
          sudo locale-gen zh_CN
          sudo update-locale

      - name: Build pull request version
        run: |
          cmake -S . -B ./build -DCMAKE_BUILD_TYPE=Release
          cmake --build ./build --config Debug --target run-all-tests


  asan:
    name: ASAN/UBSAN - ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Locales
        run: |
          sudo locale-gen es_ES
          sudo locale-gen fr_FR
          sudo locale-gen ja_JP
          sudo locale-gen zh_CN
          sudo update-locale

      - name: Build and run tests with sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          cmake -S . -B ./build-asan -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all -D_GLIBCXX_ASSERTIONS" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build ./build-asan --target run-all-tests
